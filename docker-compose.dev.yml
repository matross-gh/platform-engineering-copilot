# Development overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# New Agent FX Architecture: Core, Agents, State, Channels

services:
  # MCP Server (Multi-Agent Orchestrator)
  platform-mcp:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Logging__LogLevel__Default=Debug
      - Logging__LogLevel__Microsoft=Information

  platform-chat:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Logging__LogLevel__Default=Debug
      - Logging__LogLevel__Microsoft=Information

  cosmosdb-emulator:
    ports:
      - "8081:8081"
    volumes:
      - cosmosdb-data:/tmp/cosmos/appdata

  # Cosmos DB Emulator ships its own Data Explorer UI at
  # https://localhost:8081/_explorer/index.html (no separate admin tool needed)