# Production overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up
# New Agent FX Architecture: Core, Agents, State, Channels

services:
  # MCP Server (Multi-Agent Orchestrator)
  platform-mcp:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5100
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  platform-chat:
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # Production targets a managed Azure Cosmos DB account, not the local emulator.
  # Set CosmosDb__Endpoint / CosmosDb__Key via secrets/env vars on platform-mcp
  # and platform-chat instead of running a local cosmosdb-emulator container.

  # Production load balancer
  nginx:
    profiles: [] # Always include in production
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - supervisor-logs:/var/log/nginx
